<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мои клавиатуры</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page page--flex">
    <div class="header">
        <span class="header__logo" aria-label="Логотип: клавиша К">К</span>
        <h1>Мои клавиатуры</h1>
    </div>
    <nav class="menu">
        <a class="menu__link" href="index.html">Главная</a>
        <a class="menu__link" href="keyboards.html">Мои клавиатуры</a>
        <a class="menu__link" href="switches.html">Архив свитчей</a>
        <a class="menu__link" href="form.html">Моя сборка</a>
        <a class="menu__link menu__link--active" href="gallery.html">Галерея</a>
    </nav>
    <main class="content content--gallery">
        <h2>Галерея</h2>
        <div class="gallery">
            <figure class="gallery__item">
                <div class="gallery__frame">
                    <img class="gallery__photo" src="img/animi.jpg" alt="Animi с зелёными и белыми клавишами" width="1280" height="960">
                </div>
                <figcaption class="gallery__caption">Animi</figcaption>
            </figure>
            <figure class="gallery__item">
                <div class="gallery__frame">
                    <img class="gallery__photo" src="img/animi2.jpg" alt="Animi рядом с другими клавиатурами" width="1280" height="960">
                </div>
                <figcaption class="gallery__caption">Animi — второй кадр</figcaption>
            </figure>
            <figure class="gallery__item">
                <div class="gallery__frame">
                    <img class="gallery__photo" src="img/aurora.jpg" alt="Белая Aurora с синими клавишами" width="1280" height="960">
                </div>
                <figcaption class="gallery__caption">Aurora</figcaption>
            </figure>
            <figure class="gallery__item">
                <div class="gallery__frame">
                    <img class="gallery__photo" src="img/keycult.jpg" alt="Зелёная Keycult с оранжевыми акцентами" width="1280" height="960">
                </div>
                <figcaption class="gallery__caption">Keycult</figcaption>
            </figure>
            <figure class="gallery__item">
                <div class="gallery__frame">
                    <img class="gallery__photo" src="img/sandglass_snow.jpg" alt="Розовая клавиатура и корпус с гравировкой" width="1280" height="960">
                </div>
                <figcaption class="gallery__caption">Sandglass и Snow</figcaption>
            </figure>
            <figure class="gallery__item">
                <div class="gallery__frame">
                    <img class="gallery__photo" src="img/sunset.jpg" alt="Sunset с бордовыми и светлыми клавишами" width="1280" height="960">
                </div>
                <figcaption class="gallery__caption">Sunset</figcaption>
            </figure>
        </div>
    </main>
    <div class="footer">
        <p>Лабораторная работа №4</p>
    </div>

</html>
